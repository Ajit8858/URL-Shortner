<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="page-shell">
      <div class="container">
        <header class="topbar">
          <div class="brand-wrap">
            <div class="brand-mark">S</div>
            <div>
              <p class="eyebrow">Smart URL management</p>
              <h1>Shorten It</h1>
            </div>
          </div>
          <div class="topbar-actions">
            <div class="status-box" id="statusBox">Ready</div>
            <button id="headerLogoutBtn" type="button" class="small-button muted hidden">Logout</button>
          </div>
        </header>

        <main class="layout">
          <div id="authView" class="auth-view">
            <section class="panel auth-panel">
              <div class="auth-tabs">
                <button type="button" class="tab-button active" data-mode="register">Register</button>
                <button type="button" class="tab-button" data-mode="login">Login</button>
              </div>

              <div id="registerSection" class="auth-section">
                <div class="panel-head">
                  <span class="pill neutral">Account</span>
                  <h2>Create your account</h2>
                </div>
                <form id="registerForm" class="stacked-form compact">
                  <div class="field-group">
                    <label for="registerEmail">Email</label>
                    <input type="email" id="registerEmail" placeholder="you@example.com" required />
                  </div>
                  <div class="field-group">
                    <label for="registerPassword">Password</label>
                    <input type="password" id="registerPassword" placeholder="Create a password" required />
                  </div>
                  <button type="submit" class="primary-button ghost">Create account</button>
                </form>
                <div id="registerResult" class="result"></div>
              </div>

              <div id="loginSection" class="auth-section hidden">
                <div class="panel-head">
                  <span class="pill neutral">Account</span>
                  <h2>Welcome back</h2>
                </div>
                <form id="loginForm" class="stacked-form compact">
                  <div class="field-group">
                    <label for="loginEmail">Email</label>
                    <input type="email" id="loginEmail" placeholder="you@example.com" required />
                  </div>
                  <div class="field-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required />
                  </div>
                  <button type="submit" class="primary-button secondary">Login</button>
                </form>
                <div id="loginResult" class="result"></div>
              </div>
            </section>
          </div>

          <div id="dashboardView" class="dashboard-view hidden">
            <section class="panel shorten-panel">
              <div class="panel-head center-head">
                <span class="pill">Create link</span>
                <h2>Shorten a URL</h2>
              </div>
              <form id="shortenForm" class="stacked-form">
                <div class="field-group">
                  <label for="longUrl">Destination URL</label>
                  <input type="url" id="longUrl" placeholder="https://example.com" required />
                </div>
                <div class="field-group">
                  <label for="customAlias">Custom alias (optional)</label>
                  <input type="text" id="customAlias" placeholder="my-brand" />
                </div>
                <button type="submit" class="primary-button">Create short link</button>
              </form>
              <div id="shortenResult" class="result"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <script src="/static/app.js"></script>
  </body>
</html>
