version: "3.9"

# This compose file demonstrates the scaling topology locally:
#   nginx (load balancer)
#     -> 3x app replicas (stateless, autoscale-able)
#        -> Postgres (primary)   [add read replicas + PgBouncer for real scale]
#        -> Redis                [swap for Redis Cluster for real scale]
#
# In production, replace nginx+compose with a cloud load balancer +
# Kubernetes/ECS with HorizontalPodAutoscaler driven by the /metrics
# endpoint (CPU + request rate).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shortener
      POSTGRES_PASSWORD: shortener
      POSTGRES_DB: shortener
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shortener"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://shortener:shortener@postgres:5432/shortener
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://shortener:shortener@postgres:5432/shortener
      REDIS_URL: redis://redis:6379/0
      BASE_URL: http://localhost:8080
      SECRET_KEY: dev-secret-change-me
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 3
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app

volumes:
  pgdata:
