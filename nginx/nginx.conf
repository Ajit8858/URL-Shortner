worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # Docker Compose's internal DNS round-robins "app" across replicas;
    # least_conn spreads load more evenly than pure round-robin when
    # request cost varies (writes vs cached redirects).
    upstream app_servers {
        least_conn;
        server app:8000;
        keepalive 64;
    }

    # Basic edge-level rate limiting as a second line of defense in
    # front of the app's own Redis-backed limiter.
    limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;

    server {
        listen 80;

        location / {
            limit_req zone=perip burst=100 nodelay;

            proxy_pass http://app_servers;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }

        location /health {
            access_log off;
            proxy_pass http://app_servers;
        }
    }
}
